[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tacstack"
version = "0.1.0.dev0"
description = "Cross-sensor tactile contracts and semantic runtime foundations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcap>=1.2,<2",
    "numpy>=2,<3",
    "typer>=0.15,<1",
    "zarr>=3,<4",
]

[project.urls]
Repository = "https://github.com/mailes/TacStack"
Issues = "https://github.com/mailes/TacStack/issues"

[project.scripts]
tacstack = "tacstack.cli.main:app"

[project.optional-dependencies]
rerun = [
    "rerun-sdk>=0.23",
]
annotate = [
    "pyarrow>=14,<26",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "rerun-sdk>=0.23",
    "pyarrow>=14,<26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tacstack"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's Option/Argument singletons in parameter defaults are its public API
"src/tacstack/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# mcap ships py.typed, but its layout trips mypy's module dedup on Windows
# ("source file found twice"); we only consume its public Writer API.
module = "mcap.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker; we only use its stable table read/write API.
module = "pyarrow.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: requires physical tactile hardware (excluded in CI)"]
