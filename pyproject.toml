[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tacstack"
version = "0.1.0.dev0"
description = "Cross-sensor tactile contracts and semantic runtime foundations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "typer>=0.15,<1"]

[project.urls]
Repository = "https://github.com/mailes/TacStack"
Issues = "https://github.com/mailes/TacStack/issues"

[project.scripts]
tacstack = "tacstack.cli.main:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tacstack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: requires physical tactile hardware (excluded in CI)"]
